name: Build and test app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: matrix.platform == 'arm64'
        with:
          platforms: arm64
      - name: Build and test container
        env:
          PLATFORM: linux/${{ matrix.platform }}
        run: |
          docker build --platform "$PLATFORM" -t kidsnote-backup-test kidsnote_backup
          docker run --rm --platform "$PLATFORM" \
            -e PYTHONPATH=/app -v "$PWD/tests:/tests:ro" kidsnote-backup-test \
            python -m unittest discover -s /tests -v
      - name: Verify the app entry point
        env:
          PLATFORM: linux/${{ matrix.platform }}
        run: |
          test_dir="$(mktemp -d)"
          mkdir "$test_dir/backup"
          printf '{}' > "$test_dir/options.json"
          status=0
          docker run --rm --platform "$PLATFORM" \
            -v "$test_dir/options.json:/data/options.json:ro" \
            -v "$test_dir/backup:/config/backup" kidsnote-backup-test \
            python /app/app.py --once || status=$?
          test "$status" -eq 1
          sudo grep -q '"state": "failed"' "$test_dir/backup/status.json"
