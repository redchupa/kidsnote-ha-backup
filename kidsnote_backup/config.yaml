name: Kidsnote HA Backup
description: Back up Kidsnote reports, comments and media to local storage.
version: "0.5.1"
slug: kidsnote_backup
url: https://github.com/redchupa/kidsnote-ha-backup
arch:
  - amd64
  - aarch64
startup: application
boot: auto
stage: stable
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:book-open-page-variant-outline
panel_title: Kidsnote HA Backup
map:
  - type: addon_config
    read_only: false
options:
  username: ""
  password: ""
  child_ids: []
  interval_hours: 24
  include_albums: true
  include_notices: true
  include_menus: true
  include_schedules: true
  include_medications: true
  include_return_homes: true
  include_temperatures: true
schema:
  username: str?
  password: password?
  child_ids:
    - match(^[1-9][0-9]{0,29}\Z)
  session_cookie: password?
  interval_hours: int(1,168)
  include_albums: bool
  include_notices: bool
  include_menus: bool
  include_schedules: bool?
  include_medications: bool?
  include_return_homes: bool?
  include_temperatures: bool?
  notify_ha: bool?
