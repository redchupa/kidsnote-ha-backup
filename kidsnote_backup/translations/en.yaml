configuration:
  username:
    name: Kidsnote username
  password:
    name: Kidsnote password
  session_cookie:
    name: Kidsnote session cookie
    description: For two-step verification, enter the sessionid from a signed-in browser.
  child_ids:
    name: Child IDs
    description: Leave empty to back up all children linked to the account.
  interval_hours:
    name: Backup interval (hours)
    description: Runs on startup and waits this long after each run.
  include_albums:
    name: Back up albums
  include_notices:
    name: Back up notices
  include_menus:
    name: Back up menus
