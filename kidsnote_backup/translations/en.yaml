configuration:
  username:
    name: "[Required] Kidsnote username"
    description: For standard accounts, enter only username and password — the session cookie is issued and renewed automatically. (For 2FA/social login, leave blank and enable 'Show unused optional configuration options' below to enter session_cookie.)
  password:
    name: "[Required] Kidsnote password"
  child_ids:
    name: "[Optional] Child IDs (leave empty for all)"
    description: >-
      Leave empty to back up all linked children. To choose specific children, sign in to Kidsnote in a PC browser
      and open https://www.kidsnote.com/api/v1/me/children/ in a new tab.
      Example: { "results": [ { "id": 1234567, "name": "Sample Child", "picture": { "id": 9876543 }, "parent": { "id": 2345678 }, "enrollment": [{ "id": 3456789, "center_id": 4567890 }] } ] }
      → Enter only the id at the same level as the child's name (e.g. 1234567) and press Enter
      (do not use ids inside picture, parent, or enrollment; in YAML mode use child_ids: [1234567]).
  session_cookie:
    name: "[Optional] Kidsnote session cookie (2FA / social login only)"
    description: >-
      Leave blank if username and password sign-in works (auto-renewed). Only for two-step verification or social login:
      sign in at https://www.kidsnote.com/kr/login on a computer, then open F12 → Application → Cookies →
      www.kidsnote.com and copy only the Value for sessionid. See the Documentation tab for the full steps.
  interval_hours:
    name: "[Optional] Backup interval (hours, default 24)"
    description: >-
      How often to run automatic backups (1–168 hours, default 24). Adds a random 0–30 minute delay
      after each interval to spread traffic to Kidsnote's servers (e.g., with 24 hours set, each run
      happens every 24h to 24h 30m).
  include_albums:
    name: "[Optional] Back up albums"
  include_notices:
    name: "[Optional] Back up notices"
  include_menus:
    name: "[Optional] Back up menus"
  include_schedules:
    name: "[Optional] Back up schedules"
    description: Back up center schedules from the earliest report date onward.
  include_medications:
    name: "[Optional] Back up medication requests"
    description: Back up medication requests from the earliest report date onward.
  include_return_homes:
    name: "[Optional] Back up return-home consents"
    description: Back up return-home consents from the earliest report date onward.
  include_temperatures:
    name: "[Optional] Back up temperature logs"
    description: Back up child temperature logs from the earliest report date onward.
  notify_ha:
    name: "[Optional] Home Assistant event notification"
    description: Fire a kidsnote_backup_completed event in Home Assistant when new records are backed up.
